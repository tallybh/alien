<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hologram</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
    }
  </style>
</head>
<body>

  <video id="hologramVideo" src="hologram.mp4" playsinline preload="auto"></video>

  <script>
    const video = document.getElementById('hologramVideo');
    let isPlaying = false;
    video.loop = false;
    const TRIGGER_KEY = ' ';

    // פונקציה להפעלת הסרטון (בלחיצה / לחיצת Space)
    function startVideo() {
      if (isPlaying) return;
      isPlaying = true;
      video.currentTime = 0;
      video.style.display = 'block';
      video.play().then(() => {
        updateDebug('מנגן (לחוץ)...', '#ff0055');
      }).catch(err => {
        console.error("שגיאה בניגון:", err);
        isPlaying = false;
      });
    }

    // פונקציה לעצירת הסרטון (כשעוזבים מקש / מרימים אצבע)
    function stopVideo() {
      isPlaying = false;
      video.pause();
      video.currentTime = 0;
      video.style.display = 'none';
      updateDebug('ממתין ללחיצה...', '#00ff66');
    }

    // --- 1. מקלדת / ארדואינו (Space) ---
    window.addEventListener('keydown', (event) => {
      if (event.repeat) return;
      if (event.key === TRIGGER_KEY || event.code === 'Space') {
        event.preventDefault();
        startVideo();
      }
    });

    window.addEventListener('keyup', (event) => {
      if (event.key === TRIGGER_KEY || event.code === 'Space') {
        stopVideo();
      }
    });

    // --- 2. מגע במסך (לטאבלט - לחיצה ממושכת או נגיעה) ---
    document.addEventListener('touchstart', (event) => {
      event.preventDefault();
      startVideo();
    }, { passive: false });

    document.addEventListener('touchend', (event) => {
      stopVideo();
    });

    // --- 3. תמיכה בעכבר למחשב (לצורך בדיקות) ---
    document.addEventListener('mousedown', () => {
      startVideo();
    });

    document.addEventListener('mouseup', () => {
      stopVideo();
    });

    // --- סיום סרטון טבעי ---
    video.addEventListener('ended', () => {
      stopVideo();
    });

    // פונקציית עזר לדיבאג
    function updateDebug(text, color) {
      const debugBox = document.getElementById('debug-box');
      if (debugBox) {
        debugBox.style.color = color;
        debugBox.innerText = text;
      }
    }
  </script>

  <!-- תיבת חיווי זמנית לבדיקה - להסיר לפני פרודקשן -->
  <div id="debug-box" style="
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0, 0, 0, 0.8);
    color: #00ff66;
    padding: 10px 20px;
    font-size: 16px;
    font-family: monospace;
    border-radius: 5.5px;
    z-index: 99999;
    pointer-events: none;
  ">ממתין ללחיצה...</div>

</body>
</html>
